name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-nuget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required for NuGet Trusted Publishing (OIDC token exchange)
      contents: read

    steps:
      - name: Checkout (full history for Nerdbank.GitVersioning)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Activate Nerdbank.GitVersioning
        uses: dotnet/nbgv@v0.4.1
        id: nbgv # Instantiates environment arrays (e.g., \$NBGV_NuGetPackageVersion)

      - name: Restore dependencies
        run: dotnet restore OpenMetaverse.sln

      - name: Build (Release)
        run: dotnet build OpenMetaverse.sln -c Release --no-restore

      - name: Pack library projects
        run: |
          mkdir -p ./nupkgs
          for proj in \
            OpenMetaverse.Types/OpenMetaverse.Types.csproj \
            OpenMetaverse.StructuredData/OpenMetaverse.StructuredData.csproj \
            OpenMetaverse/OpenMetaverse.csproj \
            OpenMetaverse.Rendering.Simple/OpenMetaverse.Rendering.Simple.csproj \
            OpenMetaverse.Rendering.Meshmerizer/OpenMetaverse.Rendering.Meshmerizer.csproj; do
            dotnet pack "$proj" \
              -c Release \
              --no-build \
              --include-symbols \
              -o ./nupkgs
          done

      - name: NuGet login (OIDC -> short-lived API key)
        uses: NuGet/login@v1
        id: login
        with:
          # nuget.org account username (profile name, NOT email). Stored as a repo/org secret.
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages to NuGet.org
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate
